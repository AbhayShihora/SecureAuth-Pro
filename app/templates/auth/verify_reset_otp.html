{% extends "base.html" %}

{% block title %}
Verify Reset OTP
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">
            <h3>Verify Password Reset OTP</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                {{ form.hidden_tag() }}

                <div class="mb-3">
                    {{ form.otp.label(class="form-label") }}
                    {{ form.otp(class="form-control") }}
                </div>

                {{ form.submit(class="btn btn-warning") }}

            </form>

        </div>

    </div>

</div>

{% endblock %}
